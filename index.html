<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>漢字クイズ — Vault Quiz</title>

<!-- PWA / iOS home-screen app -->
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanji Quiz">
<meta name="application-name" content="Kanji Quiz">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --border: #2e2e2e;
  --text: #e8e8e8;
  --muted: #888;
  --accent: #c8a86b;
  --accent2: #8bb4d4;
  --green: #5a9a6e;
  --red: #9a5a5a;
  --green-bg: #1a2e1e;
  --red-bg: #2e1a1a;
  --radius: 10px;
  --font-jp: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
.wrap { width: 100%; max-width: 480px; }

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--font-jp); font-size: 22px; color: var(--accent); letter-spacing: 2px; }
.logo span { font-size: 12px; color: var(--muted); font-family: var(--font); letter-spacing: 0; margin-left: 8px; }

/* Stats bar */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.stat {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 8px;
  text-align: center;
}
.stat-val { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1; margin-bottom: 3px; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* Progress */
.progress-wrap { margin-bottom: 20px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.progress-bar { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }

/* Main question card */
.q-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
}
.mode-tag {
  display: inline-block;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--muted);
  margin-bottom: 20px;
  letter-spacing: 0.5px;
}
.q-display {
  font-family: var(--font-jp);
  font-size: 80px;
  line-height: 1;
  color: var(--text);
  margin-bottom: 12px;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.q-display.meaning-mode { font-size: 20px; font-family: var(--font); min-height: 56px; line-height: 1.4; }
.q-sub { font-size: 13px; color: var(--muted); }
.q-kanji-group { font-family: var(--font-jp); font-size: 18px; color: var(--accent); margin-top: 4px; }

/* Options */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.opt-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  font-family: var(--font);
  text-align: center;
  transition: border-color 0.12s, background 0.12s;
  line-height: 1.3;
}
.opt-btn:hover:not(:disabled) { border-color: #444; background: var(--bg3); }
.opt-btn .opt-jp { font-family: var(--font-jp); font-size: 36px; display: block; margin-bottom: 4px; }
.opt-btn .opt-sub { font-size: 11px; color: var(--muted); display: block; }
.opt-btn.correct { background: var(--green-bg); border-color: var(--green); }
.opt-btn.wrong { background: var(--red-bg); border-color: var(--red); }
.opt-btn.reveal { background: var(--green-bg); border-color: var(--green); opacity: 0.7; }

/* Feedback */
.feedback {
  min-height: 36px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
}
.feedback.correct { color: #7ab88a; }
.feedback.wrong { color: #b87a7a; }

/* Next button */
.next-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.12s, color 0.12s;
  display: none;
}
.next-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.next-btn:disabled { opacity: 0.4; cursor: default; }

/* Explain panel */
.explain {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  display: none;
}
.explain .ex-row { display: flex; gap: 10px; margin-bottom: 12px; }
.explain .ex-ans { flex: 1; min-width: 0; border-radius: 8px; padding: 8px 10px; text-align: center; }
.explain .ex-wrong { background: var(--red-bg); border: 1px solid var(--red); }
.explain .ex-correct { background: var(--green-bg); border: 1px solid var(--green); }
.explain .ex-tag { font-size: 10px; color: var(--muted); display: block; margin-bottom: 4px; }
.explain .ex-val { font-family: var(--font-jp); font-size: 16px; word-break: break-word; }
.explain .ex-kanji { font-family: var(--font-jp); font-size: 24px; color: var(--accent); text-align: center; margin-bottom: 8px; }
.explain .ex-detail { font-size: 14px; color: var(--text); text-align: center; line-height: 1.6; }
.ex-lvl { display: inline-block; font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }

/* Session end miss list */
.misses { text-align: left; margin: 4px 0 28px; display: none; }
.misses-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-align: center; }
.miss-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
}
.miss-word { font-family: var(--font-jp); font-size: 28px; color: var(--accent); min-width: 40px; text-align: center; }
.miss-info { font-size: 13px; color: var(--muted); line-height: 1.5; }
.miss-info b { color: var(--text); font-weight: 600; }

/* Mode selector */
.mode-row {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.mode-pill {
  flex: 1;
  min-width: 70px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  transition: all 0.12s;
}
.mode-pill.on { border-color: var(--accent); color: var(--accent); background: #1e1a10; }

/* Setup screen */
.setup-hero {
  text-align: center;
  padding: 24px 0 32px;
}
.setup-kanji { font-family: var(--font-jp); font-size: 64px; color: var(--accent); line-height: 1; margin-bottom: 8px; }
.setup-title { font-size: 18px; color: var(--text); margin-bottom: 4px; }
.setup-sub { font-size: 13px; color: var(--muted); }
.section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

/* Level map */
.level-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.level-meta .lm-prog { font-size:12px; color:var(--muted); }
.level-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.level-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 12px 14px;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.08s;
  position: relative;
  overflow: hidden;
}
.level-card:hover:not(.locked) { border-color: var(--accent); }
.level-card:active:not(.locked) { transform: scale(0.98); }
.level-card.locked { cursor: not-allowed; opacity: 0.5; }
.level-card.cleared { border-color: var(--green); }
.level-card.current { border-color: var(--accent2); }
.lc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.lc-num { font-size: 13px; font-weight: 600; color: var(--text); }
.lc-badge { font-size: 11px; color: var(--muted); }
.lc-badge.pass { color: var(--green); }
.lc-kanji {
  font-family: var(--font-jp);
  font-size: 19px;
  color: var(--accent);
  letter-spacing: 2px;
  line-height: 1.3;
  word-break: break-all;
}
.level-card.locked .lc-kanji { color: var(--muted); filter: blur(3px); user-select: none; }
.lc-lock { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:24px; }
.lc-score { font-size: 11px; color: var(--muted); margin-top:6px; }

/* Boss/level header */
.boss-bar {
  display:flex; justify-content:space-between; align-items:center;
  background: var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 14px; margin-bottom:16px;
}
.boss-title { font-size:13px; color:var(--accent); font-weight:600; }
.boss-kanji { font-family:var(--font-jp); font-size:15px; color:var(--text); letter-spacing:1px; }
.boss-need { font-size:11px; color:var(--muted); }
.pass-banner { font-size:14px; margin:6px 0 18px; font-weight:600; }
.pass-banner.pass { color:#7ab88a; }
.pass-banner.fail { color:#b87a7a; }

/* Start button */
.start-btn {
  width: 100%;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  padding: 16px;
  color: #0f0f0f;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.12s;
}
.start-btn:hover { opacity: 0.9; }

/* End screen */
#endscreen { display: none; }
.end-wrap { text-align: center; padding: 32px 0; }
.end-score { font-size: 56px; font-weight: 700; color: var(--accent); line-height: 1; }
.end-sub { font-size: 14px; color: var(--muted); margin: 8px 0 32px; }
.end-actions { display: flex; flex-direction: column; gap: 10px; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.12s, color 0.12s;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* Responsive */
@media (max-width: 380px) {
  .q-display { font-size: 64px; }
  .options { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">漢字クイズ <span>Anlam Quiz</span></div>
    <div id="header-info" style="font-size:12px;color:var(--muted);"></div>
  </div>

  <!-- SETUP -->
  <div id="setup">
    <div class="setup-hero">
      <div class="setup-kanji">漢</div>
      <div class="setup-title">Kanji Anlam Quiz</div>
      <div class="setup-sub">kanji_anlamlar.txt · 2104 kanji · 211 grup</div>
    </div>

    <div class="section-label">Soru modu</div>
    <div class="mode-row" id="mode-row">
      <div class="mode-pill on" data-mode="mix">Karışık</div>
      <div class="mode-pill" data-mode="k2tr">漢字→TR</div>
      <div class="mode-pill" data-mode="tr2k">TR→漢字</div>
      <div class="mode-pill" data-mode="k2en">漢字→EN</div>
      <div class="mode-pill" data-mode="en2k">EN→漢字</div>
    </div>

    <div class="section-label" style="margin-bottom:12px;">Oturum uzunluğu (soru)</div>
    <div class="mode-row" id="qcount-row">
      <div class="mode-pill on" data-n="10">10</div>
      <div class="mode-pill" data-n="20">20</div>
      <div class="mode-pill" data-n="30">30</div>
    </div>

    <div class="level-meta">
      <div class="section-label" style="margin-bottom:0;">Bölümler · her biri 10 kanji</div>
      <div class="lm-prog" id="lm-prog"></div>
    </div>
    <div class="level-grid" id="level-grid"></div>

    <button class="start-btn" id="continue-btn" onclick="startLevel(progress.unlocked)">Kaldığın yerden devam →</button>
    <button class="btn-ghost" style="margin-top:10px;" onclick="resetProgress()">İlerlemeyi sıfırla</button>
  </div>

  <!-- GAME -->
  <div id="game" style="display:none;">
    <div class="boss-bar">
      <div>
        <div class="boss-title" id="boss-title">Bölüm</div>
        <div class="boss-kanji" id="boss-kanji"></div>
      </div>
      <div class="boss-need" id="boss-need"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="s-q">0/0</div><div class="stat-label">Soru</div></div>
      <div class="stat"><div class="stat-val" id="s-c" style="color:#5a9a6e">0</div><div class="stat-label">Doğru</div></div>
      <div class="stat"><div class="stat-val" id="s-w" style="color:#9a5a5a">0</div><div class="stat-label">Yanlış</div></div>
      <div class="stat"><div class="stat-val" id="s-streak">0</div><div class="stat-label">Seri</div></div>
      <div class="stat"><div class="stat-val" id="s-acc">—</div><div class="stat-label">正答率</div></div>
      <div class="stat"><div class="stat-val" id="s-best">🔥 0</div><div class="stat-label">最高</div></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="p-label"></span>
        <span id="p-pct"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="p-fill" style="width:0%"></div></div>
    </div>

    <div class="q-card">
      <div class="mode-tag" id="q-mode-tag">—</div>
      <div class="q-display" id="q-display">—</div>
      <div class="q-sub" id="q-sub"></div>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">次へ →</button>
  </div>

  <!-- END -->
  <div id="endscreen">
    <div class="end-wrap">
      <div class="pass-banner" id="pass-banner"></div>
      <div class="end-score" id="end-score"></div>
      <div class="end-sub" id="end-sub"></div>
      <div class="misses" id="end-misses"></div>
      <div class="end-actions" id="end-actions"></div>
    </div>
  </div>
</div>

<script>

// Flatten: her kanji bir "entry"
const ALL_KANJI = [];
GROUPS.forEach(g => {
  g.kanjis.forEach(k => {
    ALL_KANJI.push({...k, groupNum: g.group});
  });
});

// Bölümler: her grup zaten 10'lu (son grup hariç)
const LEVELS = GROUPS;
const MASTERY_PCT = 85;
const LEARN_HITS = 1;

// ── PROGRESS (localStorage) ────────────────────────────────────────────────
const PROG_KEY = 'kanjiAnlamProgress_v1';
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROG_KEY));
    if (p && p.stats) return { unlocked: p.unlocked || 0, stats: p.stats };
  } catch (e) {}
  return { unlocked: 0, stats: {} };
}
function saveProgress() { try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {} }
let progress = loadProgress();

// ── MASTERY HELPERS ────────────────────────────────────────────────────────
function kanjiKey(k) { return k.kanji; }
function sectionKanjis(idx) { return LEVELS[idx].kanjis; }
function isLearned(k) { return (progress.stats[kanjiKey(k)] || 0) >= LEARN_HITS; }
function learnedCount(idx) { return sectionKanjis(idx).filter(isLearned).length; }
function sectionMastery(idx) {
  const kanjis = sectionKanjis(idx);
  if (!kanjis.length) return 0;
  return Math.round(kanjis.filter(isLearned).length / kanjis.length * 100);
}
function isMastered(idx) { return sectionMastery(idx) >= MASTERY_PCT; }
function syncUnlock() {
  while (progress.unlocked < LEVELS.length - 1 && isMastered(progress.unlocked)) {
    progress.unlocked++;
  }
}
function recordAnswer(k, correct) {
  const key = kanjiKey(k);
  const cur = progress.stats[key] || 0;
  progress.stats[key] = correct ? Math.min(LEARN_HITS, cur + 1) : Math.max(0, cur - 1);
}

// ── SRS ─────────────────────────────────────────────────────────────────────
const SRS_KEY = 'srs_anlam_data';
function loadSRS() {
  try { const s = JSON.parse(localStorage.getItem(SRS_KEY)); if (s && typeof s === 'object') return s; } catch (e) {}
  return {};
}
let srs = loadSRS();
function saveSRS() { try { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); } catch (e) {} }
function srsMiss(k) { const e = srs[kanjiKey(k)]; return e ? (e.missCount || 0) : 0; }
function recordSRS(k, correct) {
  const key = kanjiKey(k);
  const e = srs[key] || { kanji: k.kanji, missCount: 0, lastSeen: 0 };
  e.kanji = k.kanji;
  e.missCount = correct ? Math.max(0, (e.missCount || 0) - 1) : (e.missCount || 0) + 1;
  e.lastSeen = Date.now();
  srs[key] = e;
  saveSRS();
}

const BEST_KEY = 'best_streak_anlam';
function loadBest() {
  let n = parseInt(localStorage.getItem(BEST_KEY), 10);
  return isNaN(n) ? 0 : n;
}
let bestStreak = loadBest();
function saveBest() { try { localStorage.setItem(BEST_KEY, String(bestStreak)); } catch (e) {} }

// ── STATE ─────────────────────────────────────────────────────────────────
let gameMode = 'mix';
let totalQ = 10;
let currentLevel = 0;
let questions = [];
let qi = 0, correct = 0, wrong = 0, streak = 0, maxStreak = 0;
let answered = false;
let sessionWrong = [];
let nextTimer = null;

// ── SETUP ─────────────────────────────────────────────────────────────────
function buildSetup() {
  buildLevelMap();

  document.querySelectorAll('#mode-row .mode-pill').forEach(p => {
    p.onclick = () => {
      document.querySelectorAll('#mode-row .mode-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      gameMode = p.dataset.mode;
    };
  });

  document.querySelectorAll('#qcount-row .mode-pill').forEach(p => {
    p.onclick = () => {
      document.querySelectorAll('#qcount-row .mode-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      totalQ = parseInt(p.dataset.n);
    };
  });

  document.getElementById('header-info').textContent =
    LEVELS.length + ' bölüm · ' + ALL_KANJI.length + ' kanji';
}

function buildLevelMap() {
  syncUnlock();
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  LEVELS.forEach((lvl, idx) => {
    const cleared = isMastered(idx);
    const isCurrent = idx === progress.unlocked;
    const card = document.createElement('div');
    card.className = 'level-card' + (cleared ? ' cleared' : '') + (isCurrent && !cleared ? ' current' : '');
    const kanjiStr = escapeHtml(lvl.kanjis.map(k => k.kanji).join(' '));
    const total = lvl.kanjis.length;
    const learned = learnedCount(idx);
    const pct = sectionMastery(idx);
    const badge = cleared ? '<span class="lc-badge pass">✓ Tamamlandı</span>'
                          : '<span class="lc-badge">Açık</span>';
    card.innerHTML =
      '<div class="lc-top"><span class="lc-num">Bölüm ' + (idx+1) + '</span>' + badge + '</div>' +
      '<div class="lc-kanji">' + kanjiStr + '</div>' +
      '<div class="lc-score">' + learned + '/' + total + ' kanji · %' + pct + '</div>';
    card.onclick = () => startLevel(idx);
    grid.appendChild(card);
  });

  const mastered = LEVELS.reduce((n, _, idx) => n + (isMastered(idx) ? 1 : 0), 0);
  document.getElementById('lm-prog').textContent = mastered + '/' + LEVELS.length + ' tamamlandı';
  document.getElementById('continue-btn').textContent =
    'Bölüm ' + Math.min(progress.unlocked + 1, LEVELS.length) + ' → devam et';
}

function resetProgress() {
  if (!confirm('Tüm ilerleme silinecek. Emin misin?')) return;
  progress = { unlocked: 0, stats: {} };
  saveProgress();
  srs = {};
  saveSRS();
  buildLevelMap();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

// ── QUESTION GENERATION ───────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const MODES = ['k2tr', 'tr2k', 'k2en', 'en2k'];

function pickDistractors(pool, getVal, correctVal, n) {
  const seen = new Set([String(correctVal).trim()]);
  const out = [];
  for (const k of shuffle(pool)) {
    const v = getVal(k);
    const key = String(v).trim();
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(v);
    if (out.length >= n) break;
  }
  return out;
}

function buildQuestion(entry, allPool) {
  let mode = gameMode;
  if (mode === 'mix') mode = MODES[Math.floor(Math.random()*MODES.length)];

  const others = allPool.filter(k => k.kanji !== entry.kanji);

  if (mode === 'k2tr') {
    const correctAns = entry.meaning_tr;
    const wrongs = pickDistractors(others, k => k.meaning_tr, correctAns, 3);
    return {
      mode, display: entry.kanji, displayClass: '',
      modeTag: '意味は？  Türkçe anlamı nedir?',
      sub: entry.level + ' · freq#' + entry.freq + ' · ' + entry.tema,
      correctAnswer: correctAns,
      options: shuffle([correctAns, ...wrongs]),
      optStyle: 'text',
      entry
    };
  } else if (mode === 'tr2k') {
    const correctAns = entry.kanji;
    const wrongs = pickDistractors(others, k => k.kanji, correctAns, 3);
    return {
      mode, display: entry.meaning_tr, displayClass: 'meaning-mode',
      modeTag: 'どの漢字？  Hangi kanji?',
      sub: entry.level + ' · ' + entry.tema,
      correctAnswer: correctAns,
      options: shuffle([correctAns, ...wrongs]),
      optStyle: 'kanji',
      entry
    };
  } else if (mode === 'k2en') {
    const correctAns = entry.meaning_en;
    const wrongs = pickDistractors(others, k => k.meaning_en, correctAns, 3);
    return {
      mode, display: entry.kanji, displayClass: '',
      modeTag: 'What does it mean?  İngilizce anlamı?',
      sub: entry.level + ' · freq#' + entry.freq + ' · ' + entry.tema,
      correctAnswer: correctAns,
      options: shuffle([correctAns, ...wrongs]),
      optStyle: 'text',
      entry
    };
  } else {
    const correctAns = entry.kanji;
    const wrongs = pickDistractors(others, k => k.kanji, correctAns, 3);
    return {
      mode, display: entry.meaning_en, displayClass: 'meaning-mode',
      modeTag: 'Which kanji?  Hangi kanji?',
      sub: entry.level + ' · ' + entry.tema,
      correctAnswer: correctAns,
      options: shuffle([correctAns, ...wrongs]),
      optStyle: 'kanji',
      entry
    };
  }
}

function weightedSampleNoReplace(items, weightFn, n) {
  const pool = items.map(it => ({ it, w: Math.max(0.0001, weightFn(it)) }));
  const out = [];
  while (out.length < n && pool.length) {
    let total = 0;
    for (const p of pool) total += p.w;
    let r = Math.random() * total, idx = 0;
    for (; idx < pool.length - 1; idx++) { r -= pool[idx].w; if (r <= 0) break; }
    out.push(pool[idx].it);
    pool.splice(idx, 1);
  }
  return out;
}

function generateQuestions() {
  const kanjis = sectionKanjis(currentLevel);
  const n = Math.min(totalQ, kanjis.length);

  // SRS: yanlış yapılanları öne çek
  const maxSrs = Math.floor(n * 0.4);
  const missed = shuffle(kanjis.filter(k => srsMiss(k) > 0)).slice(0, maxSrs);
  const missedKeys = new Set(missed.map(kanjiKey));

  const rest = kanjis.filter(k => !missedKeys.has(kanjiKey(k)));
  const weightFn = (k) => isLearned(k) ? 1 : 3;
  const filler = weightedSampleNoReplace(rest, weightFn, n - missed.length);

  const chosen = [...missed, ...filler];
  // Use ALL_KANJI as distractor pool (broader pool = better distractors)
  questions = chosen.map(k => buildQuestion(k, ALL_KANJI));
}

// ── GAME FLOW ─────────────────────────────────────────────────────────────
function startLevel(idx) {
  if (idx < 0) idx = 0;
  if (idx >= LEVELS.length) idx = LEVELS.length - 1;
  currentLevel = idx;
  generateQuestions();
  if (!questions.length) { alert('Yeterli kanji yok!'); return; }
  qi = 0; correct = 0; wrong = 0; streak = 0; maxStreak = 0; answered = false;
  sessionWrong = [];
  clearTimeout(nextTimer);
  document.getElementById('s-acc').textContent = '—';
  updateBestDisplay();

  // Boss bar
  document.getElementById('boss-title').textContent = 'Bölüm ' + (idx+1) + ' / ' + LEVELS.length;
  document.getElementById('boss-kanji').textContent = LEVELS[idx].kanjis.map(k => k.kanji).join(' ');
  document.getElementById('boss-need').textContent = 'Açmak için kanjilerin %' + MASTERY_PCT + "'i";

  document.getElementById('setup').style.display = 'none';
  document.getElementById('endscreen').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  renderQ();
}

function updateMasteryBar() {
  const total = sectionKanjis(currentLevel).length;
  const learned = learnedCount(currentLevel);
  const pct = sectionMastery(currentLevel);
  document.getElementById('p-fill').style.width = pct + '%';
  document.getElementById('p-label').textContent = 'Öğrenilen: ' + learned + '/' + total + ' kanji';
  document.getElementById('p-pct').textContent = pct + '%';
}

function updateAccuracy() {
  const ans = correct + wrong;
  document.getElementById('s-acc').textContent = ans ? Math.round(correct / ans * 100) + '%' : '—';
}
function updateBestDisplay() {
  document.getElementById('s-best').textContent = '🔥 ' + bestStreak;
}

function addSessionWrong(q) {
  const k = q.entry.kanji;
  if (!sessionWrong.some(x => x.entry.kanji === k)) sessionWrong.push(q);
}

function hideExplain() {
  const ex = document.getElementById('explain');
  ex.style.display = 'none';
  ex.innerHTML = '';
}
function showExplain(q, chosen) {
  const e = q.entry;
  const ex = document.getElementById('explain');
  ex.innerHTML =
    '<div class="ex-row">' +
      '<div class="ex-ans ex-wrong"><span class="ex-tag">❌ Senin cevabın</span><span class="ex-val">' + escapeHtml(chosen) + '</span></div>' +
      '<div class="ex-ans ex-correct"><span class="ex-tag">✅ Doğru cevap</span><span class="ex-val">' + escapeHtml(q.correctAnswer) + '</span></div>' +
    '</div>' +
    '<div class="ex-kanji">' + escapeHtml(e.kanji) + '</div>' +
    '<div class="ex-detail">' +
      '<b>' + escapeHtml(e.meaning_tr) + '</b><br>' +
      escapeHtml(e.meaning_en) +
      '<span class="ex-lvl">' + escapeHtml(e.level) + '</span>' +
      '<br><span style="color:var(--muted);font-size:12px;">' + escapeHtml(e.tema) + '</span>' +
    '</div>';
  ex.style.display = 'block';
}

function renderQ() {
  answered = false;
  const q = questions[qi];
  const total = questions.length;

  document.getElementById('s-q').textContent = (qi+1) + '/' + total;
  document.getElementById('s-c').textContent = correct;
  document.getElementById('s-w').textContent = wrong;
  document.getElementById('s-streak').textContent = streak >= 3 ? streak+'🔥' : streak;
  updateAccuracy();
  updateBestDisplay();
  updateMasteryBar();
  hideExplain();

  document.getElementById('q-mode-tag').textContent = q.modeTag;
  const disp = document.getElementById('q-display');
  disp.textContent = q.display;
  disp.className = 'q-display ' + q.displayClass;
  document.getElementById('q-sub').textContent = q.sub;

  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className = 'feedback';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.setAttribute('aria-label', 'Şık ' + (i+1) + ': ' + opt);
    if (q.optStyle === 'kanji') {
      const span = document.createElement('span');
      span.className = 'opt-jp';
      span.textContent = opt;
      btn.appendChild(span);
    } else {
      btn.textContent = opt;
    }
    btn.onclick = () => checkAnswer(btn, opt, q);
    opts.appendChild(btn);
  });

  clearTimeout(nextTimer);
  const nb = document.getElementById('next-btn');
  nb.style.display = 'none';
  nb.disabled = false;
}

function checkAnswer(btn, chosen, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  const isCorrect = chosen === q.correctAnswer;
  const e = q.entry;

  recordAnswer(e, isCorrect);
  recordSRS(e, isCorrect);
  saveProgress();

  const nb = document.getElementById('next-btn');

  if (isCorrect) {
    btn.classList.add('correct');
    correct++;
    streak++;
    if (streak > maxStreak) maxStreak = streak;
    if (streak > bestStreak) { bestStreak = streak; saveBest(); }
    document.getElementById('s-c').textContent = correct;
    document.getElementById('s-streak').textContent = streak >= 3 ? streak+'🔥' : streak;

    fb.textContent = '✓ ' + e.kanji + ' — ' + e.meaning_tr + ' (' + e.meaning_en + ')';
    fb.className = 'feedback correct';
    hideExplain();

    nb.style.display = 'block';
    nb.disabled = false;
  } else {
    btn.classList.add('wrong');
    wrong++;
    streak = 0;
    document.getElementById('s-w').textContent = wrong;
    document.getElementById('s-streak').textContent = 0;

    allBtns.forEach(b => {
      const bText = b.querySelector('.opt-jp')?.textContent || b.textContent;
      if (bText.trim() === q.correctAnswer.trim()) b.classList.add('reveal');
    });

    fb.textContent = '';
    fb.className = 'feedback wrong';
    addSessionWrong(q);
    showExplain(q, chosen);

    nb.style.display = 'block';
    nb.disabled = true;
    clearTimeout(nextTimer);
    nextTimer = setTimeout(() => { nb.disabled = false; }, 1500);
  }

  updateAccuracy();
  updateBestDisplay();
  updateMasteryBar();
}

function nextQ() {
  qi++;
  if (qi >= questions.length) { showEnd(); return; }
  renderQ();
}

function showEnd() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('endscreen').style.display = 'block';

  const sessionPct = Math.round(correct/questions.length*100);
  const total = sectionKanjis(currentLevel).length;
  const learned = learnedCount(currentLevel);
  const masteryPct = sectionMastery(currentLevel);
  const mastered = masteryPct >= MASTERY_PCT;
  const isLast = currentLevel >= LEVELS.length - 1;

  const prevUnlocked = progress.unlocked;
  syncUnlock();
  const justUnlocked = progress.unlocked > prevUnlocked;
  saveProgress();

  const banner = document.getElementById('pass-banner');
  banner.className = 'pass-banner ' + (mastered ? 'pass' : 'fail');
  banner.textContent = mastered
    ? (isLast ? '🏆 Tüm kanjileri öğrendin!' : (justUnlocked ? '勝利！ Bölüm tamamlandı — yeni bölüm açıldı!' : '✓ Bölüm tamamlandı!'))
    : 'Devam et — kanjilerin %' + MASTERY_PCT + "'ini öğrenince bölüm açılır";

  document.getElementById('end-score').textContent = learned + '/' + total;
  const remaining = Math.max(0, Math.ceil(total * MASTERY_PCT/100) - learned);
  const label = mastered ? 'Bölüm tamam 🎉'
    : (remaining <= 3 ? 'Az kaldı! ' + remaining + ' kanji daha 💪' : remaining + ' kanji daha öğren 📖');
  document.getElementById('end-sub').textContent =
    'Bölüm ustalığı: %' + masteryPct + ' · 正答率 ' + sessionPct + '% · En uzun seri: ' + maxStreak + ' · 最高 🔥 ' + bestStreak + ' · ' + label;

  // Yanlış cevaplanan kanjiler
  const misses = document.getElementById('end-misses');
  if (sessionWrong.length) {
    let html = '<div class="misses-title">Bu oturumda zorlandığın kanjiler (' + sessionWrong.length + ')</div>';
    for (const q of sessionWrong) {
      const e = q.entry;
      html +=
        '<div class="miss-item">' +
          '<div class="miss-word">' + escapeHtml(e.kanji) + '</div>' +
          '<div class="miss-info"><b>' + escapeHtml(e.meaning_tr) + '</b><br>' +
          escapeHtml(e.meaning_en) +
          '<span class="ex-lvl">' + escapeHtml(e.level) + '</span>' +
          '<br><span style="color:var(--muted);font-size:11px;">' + escapeHtml(e.tema) + '</span></div>' +
        '</div>';
    }
    misses.innerHTML = html;
    misses.style.display = 'block';
  } else {
    misses.innerHTML = '';
    misses.style.display = 'none';
  }

  const acts = document.getElementById('end-actions');
  acts.innerHTML = '';
  if (mastered && !isLast) {
    acts.appendChild(makeBtn('start-btn', 'Sonraki bölüm (' + (currentLevel+2) + ') →', () => startLevel(currentLevel + 1)));
    acts.appendChild(makeBtn('btn-ghost', 'Bu bölümü tekrarla', () => startLevel(currentLevel)));
  } else if (!mastered) {
    acts.appendChild(makeBtn('start-btn', 'Çalışmaya devam et', () => startLevel(currentLevel)));
  } else {
    acts.appendChild(makeBtn('start-btn', 'Tekrar çalış', () => startLevel(currentLevel)));
  }
  acts.appendChild(makeBtn('btn-ghost', 'Bölüm haritası', () => showSetup()));
}

function makeBtn(cls, text, fn) {
  const b = document.createElement('button');
  b.className = cls;
  b.textContent = text;
  b.onclick = fn;
  return b;
}

function showSetup() {
  document.getElementById('endscreen').style.display = 'none';
  document.getElementById('game').style.display = 'none';
  buildLevelMap();
  document.getElementById('setup').style.display = 'block';
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (document.getElementById('game').style.display !== 'block') return;
  if (!answered && e.key >= '1' && e.key <= '9') {
    const idx = parseInt(e.key, 10) - 1;
    const btns = document.querySelectorAll('.opt-btn');
    if (idx < btns.length) btns[idx].click();
  } else if (answered && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    const nb = document.getElementById('next-btn');
    if (nb.style.display !== 'none' && !nb.disabled) nextQ();
  }
});

// ── INIT ──────────────────────────────────────────────────────────────────
buildSetup();

// ── SERVICE WORKER ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
